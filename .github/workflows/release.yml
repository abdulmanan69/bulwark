name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no long-lived PyPI token to leak
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - name: Verify the tag matches the package version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from bulwark.version import __version__; print(__version__)")
          test "refs/tags/v$VERSION" = "${{ github.ref }}" \
            || { echo "tag ${{ github.ref }} does not match version $VERSION"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
