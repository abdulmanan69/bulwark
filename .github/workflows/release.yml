name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no long-lived PyPI token to leak
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7

        with:
          python-version: "3.11"
      - run: python -m pip install build && python -m build
      - name: Verify the tag matches the package version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from bulwark.version import __version__; print(__version__)")
          test "refs/tags/v$VERSION" = "${{ github.ref }}" \
            || { echo "tag ${{ github.ref }} does not match version $VERSION"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI is not an error worth failing a release
          # over: it means the upload happened another way, or a tag was
          # re-pushed. PyPI refuses duplicate versions regardless, so the only
          # thing a hard failure adds here is a red X nobody can act on.
          skip-existing: true
